<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 사다리타기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>🎲 우리 반 사다리타기</h1>
    <p class="intro">이름을 바꾸고 사다리를 만든 다음, 참가자를 선택해 보세요!</p>
    <section class="panel" aria-label="참가자 설정">
      <h2>참가자 이름</h2>
      <div class="inputs" id="nameInputs">
        <label>1번 <input type="text" maxlength="12" value="철수" aria-label="1번 참가자 이름"></label>
        <label>2번 <input type="text" maxlength="12" value="영희" aria-label="2번 참가자 이름"></label>
        <label>3번 <input type="text" maxlength="12" value="민수" aria-label="3번 참가자 이름"></label>
        <label>4번 <input type="text" maxlength="12" value="지우" aria-label="4번 참가자 이름"></label>
        <label>5번 <input type="text" maxlength="12" value="하늘" aria-label="5번 참가자 이름"></label>
      </div>
      <h2>도착 결과 <span class="hint">(수정 가능)</span></h2>
      <div class="inputs" id="prizeInputs">
        <label>1번 <input type="text" maxlength="12" value="간식" aria-label="1번 결과"></label>
        <label>2번 <input type="text" maxlength="12" value="청소" aria-label="2번 결과"></label>
        <label>3번 <input type="text" maxlength="12" value="면제" aria-label="3번 결과"></label>
        <label>4번 <input type="text" maxlength="12" value="발표" aria-label="4번 결과"></label>
        <label>5번 <input type="text" maxlength="12" value="행운" aria-label="5번 결과"></label>
      </div>
      <div class="actions">
        <button id="createButton" type="button">🪜 사다리 만들기</button>
        <button id="resetButton" type="button" class="secondary">🔄 다시 만들기</button>
      </div>
    </section>
    <section class="panel game" aria-label="사다리 게임">
      <h2>참가자를 클릭해 출발하세요!</h2>
      <div class="players" id="players"></div>
      <canvas id="ladder" aria-label="5명 사다리타기 경로 그림"></canvas>
      <div class="prizes" id="prizes"></div>
      <p id="result" role="status" aria-live="polite">사다리 만들기 버튼을 눌러 시작하세요.</p>
    </section>
    <section class="panel" aria-label="데이터베이스 기록">
      <h2>💾 사다리 결과 저장 및 관리</h2>
      <p class="help">경로를 끝까지 따라간 참가자만 저장합니다. 2명을 선택했다면 2명만 저장됩니다.</p>
      <div class="actions">
        <button id="saveButton" type="button">💾 선택한 0명 결과 저장</button>
        <button id="loadButton" type="button" class="secondary">📋 저장 기록 조회</button>
      </div>
      <p id="apiStatus" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table id="recordsTable">
          <thead><tr><th>ID</th><th>회차</th><th>이름</th><th>결과</th><th>관리</th></tr></thead>
          <tbody id="recordsBody"><tr><td colspan="5">조회 버튼을 눌러 주세요.</td></tr></tbody>
        </table>
      </div>
    </section>
    <p class="note">HTML = 구조 · CSS = 디자인 · JavaScript = 동작</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
